# ─────────────────────────────────────────────────────────────────────────────
# Sharexpress Cloud — Nginx configuration
# Serves the frontend on port 80/443 and proxies /api/* to FastAPI on :8000
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/cloud.sharexpress.in
#   sudo ln -sf /etc/nginx/sites-available/cloud.sharexpress.in \
#               /etc/nginx/sites-enabled/cloud.sharexpress.in
#   sudo nginx -t && sudo systemctl reload nginx
#
# For SSL, run: sudo certbot --nginx -d cloud.sharexpress.in
# ─────────────────────────────────────────────────────────────────────────────

upstream backend_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream frontend_ssr {
    server 127.0.0.1:3000;   # only if running Nitro SSR service
    keepalive 16;
}

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cloud.sharexpress.in;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── Main HTTPS server ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cloud.sharexpress.in;

    # SSL — managed by Certbot (auto-updated)
    ssl_certificate     /etc/letsencrypt/live/cloud.sharexpress.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.sharexpress.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # ── API proxy → FastAPI :8000 ─────────────────────────────────────────
    location /api/ {
        proxy_pass          http://backend_api/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ── FastAPI docs (internal only) ──────────────────────────────────────
    location /api/docs {
        proxy_pass http://backend_api/docs;
    }

    # ── Static frontend assets ─────────────────────────────────────────────
    root /var/www/cloud.sharexpress/public;
    index index.html;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — send all unknown routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
